<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ehliyet İlk Yardım Deneme</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.container{max-width:750px;margin:auto;background:#fff;padding:20px;border-radius:8px}
.hidden{display:none}
.question{margin-bottom:15px;padding:15px;background:#f9f9f9;border-radius:5px}
.question h3{margin-bottom:10px;color:#333}
.answers label{display:block;margin:6px 0;cursor:pointer;padding:8px;border-radius:4px}
.answers label:hover{background:#e9e9e9}
.answers input{margin-right:8px}
.timer{font-weight:bold;color:#b00000;margin:10px 0;font-size:20px}
.correct{color:green;font-weight:bold}
.wrong{color:red;font-weight:bold}
button{padding:10px 20px;font-size:16px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer;margin:5px}
button:hover{background:#45a049}
#finishBtn{background:#f44336}
#finishBtn:hover{background:#da190b}
#result{margin-top:20px;padding:15px;background:#f0f0f0;border-radius:5px}
</style>
</head>
<body>

<div class="container">
<h2>Ehliyet İlk Yardım Deneme Sınavı</h2>

<button id="startBtn">Başla</button>
<div id="timer" class="timer hidden">12:00</div>

<form id="quiz" class="hidden"></form>

<button id="finishBtn" class="hidden">Sınavı Bitir</button>
<div id="result"></div>
</div>

<script>
const questions=[
{q:"İlk yardımın tanımı nedir?",a:["Hastanede tedavi","İlaçla müdahale","Sağlık gelene kadar yapılan müdahale","Ameliyat"],c:2},
{q:"Solunumu duran kişide ilk ne yapılır?",a:["Kalp masajı","Su içirmek","Hava yolu açılır","Yan yatırmak"],c:2},
{q:"Bilinç kapalıysa ilk kontrol?",a:["Nabız","Solunum","Kanama","Ateş"],c:1},
{q:"Kanamalarda ilk amaç nedir?",a:["Kanı durdurmak","Temizlemek","Sarmak","Yatırmak"],c:0},
{q:"Şok pozisyonu nasıldır?",a:["Baş yukarı","Ayaklar yukarı","Yan","Oturur"],c:1},
{q:"Yanıkta ilk yapılacak?",a:["Buz","Diş macunu","Soğuk su","Patlatmak"],c:2},
{q:"Burun kanamasında ne yapılır?",a:["Baş geriye","Baş öne","Yatırılır","Pamuk"],c:1},
{q:"Kırık şüphesinde?",a:["Masaj","Hareket","Tespit","Isı"],c:2},
{q:"Zehirlenmede ilk işlem?",a:["Kustur","Süt","112 ara","Uyut"],c:2},
{q:"Kalp masajı dakikada kaç bası?",a:["60","80","100-120","150"],c:2},
{q:"Bilinçsiz ama soluyan kişi?",a:["Sırtüstü","Şok","Koma","Oturur"],c:2},
{q:"Elektrik çarpmasında ilk?",a:["Dokun","Su","Elektriği kes","Koş"],c:2},
{q:"ABC ne demek?",a:["Acil Bilgi","Ateş Basınç","Hava Solunum Dolaşım","Ağrı"],c:2},
{q:"Kalp masajı nereye?",a:["Kaburga","Göğüs ortası","Karın","Boyun"],c:1},
{q:"Koma pozisyonunun amacı?",a:["Uyutmak","Rahatlatmak","Hava yolunu açık tutmak","Ağrı"],c:2}
];

const quiz=document.getElementById("quiz");
const startBtn=document.getElementById("startBtn");
const finishBtn=document.getElementById("finishBtn");
const timerDiv=document.getElementById("timer");
const resultDiv=document.getElementById("result");

let time=12*60,timer;
let userAnswers=[];

function start(){
startBtn.classList.add("hidden");
quiz.classList.remove("hidden");
finishBtn.classList.remove("hidden");
timerDiv.classList.remove("hidden");
loadQuestions();
timer=setInterval(countdown,1000);
userAnswers=[];
}

function countdown(){
let m=Math.floor(time/60);
let s=time%60;
timerDiv.textContent=`${m}:${s<10?"0":""}${s}`;
if(time<=0){
clearInterval(timer);
finish();
}
time--;
}

function loadQuestions(){
quiz.innerHTML="";
questions.forEach((q,i)=>{
let div=document.createElement("div");
div.className="question";
div.innerHTML=`<h3>${i+1}. ${q.q}</h3><div class="answers">`;
q.a.forEach((answer,j)=>{
div.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}"> ${answer}</label>`;
});
div.innerHTML+="</div>";
quiz.appendChild(div);
});
}

function finish(){
clearInterval(timer);
let correct=0;
let total=questions.length;

questions.forEach((q,i)=>{
let selected=document.querySelector(`input[name="q${i}"]:checked`);
if(selected){
let answerIndex=parseInt(selected.value);
userAnswers[i]=answerIndex;
if(answerIndex===q.c){
correct++;
}
}else{
userAnswers[i]=-1;
}
});

let percentage=Math.round((correct/total)*100);
let pass=percentage>=70;

resultDiv.innerHTML=`
<h3>Sınav Sonucu</h3>
<p><strong>Doğru:</strong> <span class="correct">${correct}</span> / ${total}</p>
<p><strong>Yanlış:</strong> <span class="wrong">${total-correct}</span></p>
<p><strong>Boş:</strong> ${userAnswers.filter(a=>a===-1).length}</p>
<p><strong>Başarı Oranı:</strong> ${percentage}%</p>
<p style="font-size:18px;margin-top:15px;"><strong>${pass?"✅ Başarılı!":"❌ Başarısız!"}</strong></p>
`;

finishBtn.classList.add("hidden");
quiz.classList.add("hidden");
timerDiv.classList.add("hidden");

showAnswers();
}

function showAnswers(){
questions.forEach((q,i)=>{
let questionDiv=quiz.children[i];
let labels=questionDiv.querySelectorAll("label");
labels.forEach((label,j)=>{
if(j===q.c){
label.style.color="green";
label.innerHTML+=" ✓";
}
if(userAnswers[i]===j && j!==q.c){
label.style.color="red";
label.innerHTML+=" ✗";
}
});
});
}

startBtn.addEventListener("click",start);
finishBtn.addEventListener("click",finish);
</script>
</body>
</html>
